name: Update contribution heatmap

on:
  schedule:
    # 03:17 UTC daily - an off-the-hour time, since GitHub delays cron jobs
    # scheduled on the hour when the queue is busy.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py \
            --user "${{ github.repository_owner }}" \
            --output data/contributions.json

      - name: Render heatmap
        run: |
          python scripts/render_heatmap_svg.py \
            --input data/contributions.json \
            --output assets/heatmap.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap.svg data/contributions.json
          if git diff --staged --quiet; then
            echo "No change in contribution data."
          else
            git commit -m "chore: refresh contribution heatmap"
            git push
          fi
