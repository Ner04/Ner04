" x2="1000" y2="288"/><line x1="0" y1="320" x2="1000" y2="320"/><line x1="0" y1="352" x2="1000" y2="352"/><line x1="0" y1="384" x2="1000" y2="384"/><line x1="0" y1="416" x2="1000" y2="416"/><line x1="0" y1="448" x2="1000" y2="448"/><line x1="0" y1="480" x2="1000" y2="480"/></g><text x="56" y="84" font-size="18" font-weight="600" letter-spacing="1" fill="#25d366">SYSTEM DESIGN · HLD</text><text x="56" y="140" font-size="42" font-weight="700" fill="#e6edf3">I Tried to Rebuild WhatsApp</text><text x="56" y="192" font-size="42" font-weight="700" fill="#e6edf3">on a Whiteboard.</text><text x="56" y="246" font-size="25" font-weight="500" fill="#8b949e">The server forgets everything —</text><text x="56" y="280" font-size="25" font-weight="500" fill="#8b949e">on purpose.</text><rect x="56" y="318" width="105.2" height="38" rx="19" fill="none" stroke="#00a884" stroke-width="2"/><text x="108.6" y="343" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">1B users</text><rect x="171.2" y="318" width="133.4" height="38" rx="19" fill="none" stroke="#00a884" stroke-width="2"/><text x="237.89999999999998" y="343" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">~1.2M msg/s</text><rect x="314.6" y="318" width="152.2" height="38" rx="19" fill="none" stroke="#00a884" stroke-width="2"/><text x="390.70000000000005" y="343" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">E2E encrypted</text><rect x="476.8" y="318" width="208.6" height="38" rx="19" fill="none" stroke="#00a884" stroke-width="2"/><text x="581.1" y="343" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">delivered = deleted</text><text x="56" y="430" font-size="17" font-weight="500" fill="#00a884">Read on Medium →</text><rect x="700" y="96" width="250" height="52" rx="14" fill="#161b22"/><text x="718" y="128" font-size="17" fill="#e6edf3">Did you get my message?</text><rect x="720" y="166" width="250" height="70" rx="14" fill="#005c4b"/><text x="738" y="196" font-size="17" fill="#e6edf3">Yes — and the server</text><text x="738" y="220" font-size="17" fill="#e6edf3">already deleted it.</text><path d="M930 213l5 5l10 -12M938 217l1 1l10 -12" fill="none" stroke="#53bdeb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="700" y="254" width="180" height="50" rx="14" fill="#161b22"/><text x="718" y="285" font-size="17" fill="#e6edf3">Wait, what?</text><ellipse cx="830" cy="350" rx="56" ry="14" fill="none" stroke="#8b949e" stroke-width="2.5"/><path d="M774 350v62a56 14 0 0 0 112 0v-62" fill="none" stroke="#8b949e" stroke-width="2.5"/><path d="M808 370l44 38M852 370l-44 38" stroke="#ef5350" stroke-width="5" stroke-linecap="round"/></svg>